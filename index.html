<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Expense Log</title>
<style>
  :root {
    --bg: #FAF8F5;
    --card: #ffffff;
    --border: #EFEAE3;
    --text: #3D3833;
    --muted: #8A8378;
    --muted2: #B5AFA5;
    --food: #E07A5F;
    --travel: #3D8BFD;
    --rent: #81B29A;
    --ent: #9B5DE5;
    --save: #F2CC8F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 70px;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 24px; font-weight: 700; margin: 0; }
  .subtitle { font-size: 13px; color: var(--muted); margin: 4px 0 20px; }

  .cat-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 12px; margin-bottom: 10px;
  }
  .icon-box {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .cat-name { font-weight: 500; flex: 1; }
  .amt-wrap { display: flex; align-items: center; gap: 4px; }
  .amt-wrap span { color: var(--muted2); font-size: 14px; }
  input[type=number] {
    width: 80px; text-align: right; border: none; border-bottom: 2px solid var(--border);
    outline: none; background: transparent; font-size: 16px; padding: 4px 0;
    color: var(--text);
  }
  input[type=number]:focus { border-bottom-color: var(--text); }
  .add-btn {
    width: 36px; height: 36px; border-radius: 10px; border: none;
    color: white; font-size: 20px; font-weight: bold; cursor: pointer; flex-shrink: 0;
  }

  .toast {
    text-align: center; font-size: 13px; color: var(--rent); font-weight: 600;
    padding: 4px 0; min-height: 20px;
  }

  .summary-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; margin-top: 16px;
  }
  .summary-card p.label { font-size: 13px; color: var(--muted); margin: 0; }
  .summary-card p.value { font-size: 26px; font-weight: 700; margin: 4px 0 0; }

  .entries-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-top: 12px; }
  .entries-card .label { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .entry-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .entry-row:last-child { border-bottom: none; }
  .entry-left { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .entry-date { color: var(--muted2); font-size: 12px; }
  .del-btn { border: none; background: none; color: #D9A39A; font-size: 16px; cursor: pointer; padding: 2px 6px; }

  .filter-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .filter-card .label { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .filter-row { display: flex; gap: 10px; }
  .filter-row > div { flex: 1; }
  .filter-row label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=date] {
    width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; color: var(--text); background: var(--bg);
  }
  .clear-filter { margin-top: 8px; background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }

  .breakdown-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .breakdown-total { display: flex; justify-content: space-between; font-weight: 700; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    border-top: 1px solid var(--border); display: flex;
  }
  .nav-btn {
    flex: 1; padding: 10px 0; text-align: center; border: none; background: none;
    font-size: 12px; font-weight: 600; color: var(--muted2); cursor: pointer;
  }
  .nav-btn.active { color: var(--text); }
  .nav-icon { font-size: 18px; display: block; margin-bottom: 2px; }

  .view { display: none; }
  .view.active { display: block; }

  .bar-chart-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .bar-label { width: 90px; font-size: 12px; flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--border); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-value { font-size: 12px; font-weight: 600; width: 70px; text-align: right; flex-shrink: 0; }

  .empty-msg { text-align: center; color: var(--muted); padding: 24px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>Expense Log</h1>
  <p class="subtitle">Tap a category, enter the amount, done. Stored on this device only.</p>

  <!-- ENTRY VIEW -->
  <div id="view-entry" class="view active">
    <div id="cat-rows"></div>
    <div class="toast" id="toast"></div>

    <div class="summary-card">
      <p class="label">Total tracked (all time)</p>
      <p class="value" id="grand-total">₹0</p>
    </div>

    <div class="entries-card">
      <p class="label">Recent entries</p>
      <div id="recent-entries"></div>
    </div>

    <button id="export-btn" style="width:100%;margin-top:12px;padding:12px;border:none;border-radius:12px;background:var(--text);color:white;font-size:14px;font-weight:600;cursor:pointer;">
      ⬇ Export & clear (creates exp file)
    </button>
    <p id="last-export-info" style="text-align:center;font-size:12px;color:var(--muted);margin-top:6px;"></p>
  </div>

  <!-- ANALYTICS VIEW -->
  <div id="view-analytics" class="view">
    <div class="filter-card">
      <p class="label">Date range</p>
      <div class="filter-row">
        <div>
          <label>From</label>
          <input type="date" id="date-from">
        </div>
        <div>
          <label>To</label>
          <input type="date" id="date-to">
        </div>
      </div>
      <button class="clear-filter" id="clear-filter">Clear filter</button>
    </div>

    <div id="analytics-content"></div>
  </div>

  <!-- ALL DATA VIEW -->
  <div id="view-data" class="view">
    <div class="entries-card">
      <p class="label">All stored entries</p>
      <div id="all-entries-table"></div>
    </div>
  </div>

  <!-- MERGE VIEW -->
  <div id="view-merge" class="view">
    <div class="filter-card">
      <p class="label">Merge exported files</p>
      <p style="font-size:13px;color:var(--muted);margin:0 0 10px;">Select multiple exp*.csv backup files to combine and analyze together.</p>
      <input type="file" id="merge-files" accept=".csv" multiple style="width:100%;">
    </div>
    <div id="merge-summary"></div>
    <div id="merge-content"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-entry">
      <span class="nav-icon">＋</span>Add
    </button>
    <button class="nav-btn" id="nav-analytics">
      <span class="nav-icon">📊</span>Analytics
    </button>
    <button class="nav-btn" id="nav-data">
      <span class="nav-icon">📋</span>All Data
    </button>
    <button class="nav-btn" id="nav-merge">
      <span class="nav-icon">🔀</span>Merge
    </button>
  </div>
</div>

<script>
const CATEGORIES = [
  { id: "Food In", icon: "🍳", color: "var(--food)", hex: "#E07A5F" },
  { id: "Food Out", icon: "🍽️", color: "var(--save)", hex: "#F2CC8F" },
  { id: "Rent", icon: "🏠", color: "var(--rent)", hex: "#81B29A" },
  { id: "Travel", icon: "✈️", color: "var(--travel)", hex: "#3D8BFD" },
  { id: "Lend", icon: "🤝", color: "var(--ent)", hex: "#9B5DE5" },
  { id: "Invest", icon: "📈", color: "#2A9D8F", hex: "#2A9D8F" },
];

const CUSTOM_CAT_ID = "__custom__";

const STORAGE_KEY = "expense_entries_v1";

function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveEntries(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

let entries = loadEntries();

function slug(s) { return s.replace(/[^a-zA-Z0-9]/g, "_"); }

// Build category rows
const catRowsEl = document.getElementById("cat-rows");
CATEGORIES.forEach(cat => {
  const sid = slug(cat.id);
  const row = document.createElement("div");
  row.className = "cat-row";
  row.style.flexDirection = "column";
  row.style.alignItems = "stretch";
  row.style.gap = "8px";
  row.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="icon-box" style="background:${cat.hex}22;">${cat.icon}</div>
      <span class="cat-name">${cat.id}</span>
      <div class="amt-wrap">
        <span>₹</span>
        <input type="number" inputmode="decimal" placeholder="0" id="input-${sid}">
      </div>
      <button class="add-btn" style="background:${cat.hex}" data-cat="${cat.id}" data-sid="${sid}">+</button>
    </div>
    <input type="text" placeholder="Description (optional)" id="desc-${sid}" style="border:none;border-bottom:1px solid var(--border);outline:none;background:transparent;font-size:13px;padding:4px 2px;color:var(--text);width:100%;">
  `;
  catRowsEl.appendChild(row);
});

// Custom category row
const customRow = document.createElement("div");
customRow.className = "cat-row";
customRow.style.flexDirection = "column";
customRow.style.alignItems = "stretch";
customRow.style.gap = "8px";
customRow.innerHTML = `
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="icon-box" style="background:#cccccc22;">✏️</div>
    <input type="text" placeholder="Custom category" id="custom-cat-name" style="flex:1;border:none;border-bottom:2px solid var(--border);outline:none;background:transparent;font-size:14px;font-weight:500;padding:4px 0;color:var(--text);min-width:0;">
    <div class="amt-wrap">
      <span>₹</span>
      <input type="number" inputmode="decimal" placeholder="0" id="input-custom">
    </div>
    <button class="add-btn" style="background:#8A8378;" id="add-custom">+</button>
  </div>
  <input type="text" placeholder="Description (optional)" id="desc-custom" style="border:none;border-bottom:1px solid var(--border);outline:none;background:transparent;font-size:13px;padding:4px 2px;color:var(--text);width:100%;">
`;
catRowsEl.appendChild(customRow);

// Add handlers
document.querySelectorAll(".add-btn[data-cat]").forEach(btn => {
  btn.addEventListener("click", () => addEntry(btn.dataset.cat, btn.dataset.sid));
});
CATEGORIES.forEach(cat => {
  const sid = slug(cat.id);
  document.getElementById(`input-${sid}`).addEventListener("keydown", e => {
    if (e.key === "Enter") addEntry(cat.id, sid);
  });
});

document.getElementById("add-custom").addEventListener("click", addCustomEntry);
document.getElementById("input-custom").addEventListener("keydown", e => {
  if (e.key === "Enter") addCustomEntry();
});

function addCustomEntry() {
  const nameInput = document.getElementById("custom-cat-name");
  const amtInput = document.getElementById("input-custom");
  const catName = nameInput.value.trim();
  const val = parseFloat(amtInput.value);
  if (!catName || !val || val <= 0) return;
  const descInput = document.getElementById("desc-custom");
  entries.push({
    id: Date.now() + "-custom",
    category: catName,
    amount: val,
    date: new Date().toISOString(),
    description: (descInput.value || "").trim()
  });
  saveEntries(entries);
  amtInput.value = "";
  nameInput.value = "";
  descInput.value = "";
  showToast(`Added ₹${val} to ${catName}`);
  renderEntry();
  renderAnalytics();
}

function addEntry(catId, sid) {
  const input = document.getElementById(`input-${sid}`);
  const descInput = document.getElementById(`desc-${sid}`);
  const val = parseFloat(input.value);
  if (!val || val <= 0) return;
  entries.push({
    id: Date.now() + "-" + sid,
    category: catId,
    amount: val,
    date: new Date().toISOString(),
    description: (descInput.value || "").trim()
  });
  saveEntries(entries);
  input.value = "";
  descInput.value = "";
  showToast(`Added ₹${val} to ${catId}`);
  renderEntry();
  renderAnalytics();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  setTimeout(() => { if (t.textContent === msg) t.textContent = ""; }, 1500);
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  saveEntries(entries);
  renderEntry();
  renderAnalytics();
}

function fmt(n) {
  return "₹" + n.toLocaleString("en-IN", { maximumFractionDigits: 2 });
}

function renderEntry() {
  const total = entries.reduce((s, e) => s + e.amount, 0);
  document.getElementById("grand-total").textContent = fmt(total);

  const recentEl = document.getElementById("recent-entries");
  recentEl.innerHTML = "";
  if (entries.length === 0) {
    recentEl.innerHTML = `<div class="empty-msg">No entries yet. Add your first expense above.</div>`;
    return;
  }
  entries.slice().reverse().slice(0, 10).forEach(e => {
    const cat = CATEGORIES.find(c => c.id === e.category);
    const hex = cat ? cat.hex : "#8A8378";
    const d = new Date(e.date);
    const row = document.createElement("div");
    row.className = "entry-row";
    row.style.flexDirection = "column";
    row.style.alignItems = "stretch";
    row.style.gap = "2px";
    const desc = (e.description || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    row.innerHTML = `
      <div class="entry-left" style="justify-content:space-between;width:100%;">
        <div class="entry-left">
          <span class="dot" style="background:${hex}"></span>
          <span>${e.category}</span>
          <span class="entry-date">${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
        </div>
        <div class="entry-left">
          <span style="font-weight:600">${fmt(e.amount)}</span>
          <button class="del-btn" data-id="${e.id}">🗑️</button>
        </div>
      </div>
      ${desc ? `<div style="font-size:12px;color:var(--muted);padding-left:16px;">${desc}</div>` : ""}
    `;
    recentEl.appendChild(row);
  });
  recentEl.querySelectorAll(".del-btn").forEach(b => {
    b.addEventListener("click", () => deleteEntry(b.dataset.id));
  });
}

function getFilteredEntries() {
  const from = document.getElementById("date-from").value;
  const to = document.getElementById("date-to").value;
  return entries.filter(e => {
    const d = e.date.slice(0, 10); // YYYY-MM-DD
    if (from && d < from) return false;
    if (to && d > to) return false;
    return true;
  });
}

function buildTotals(list) {
  const knownIds = new Set(CATEGORIES.map(c => c.id));
  const totals = CATEGORIES.map(c => ({
    ...c,
    value: list.filter(e => e.category === c.id).reduce((s, e) => s + e.amount, 0)
  }));
  // Add custom categories present in data
  const customNames = [...new Set(list.map(e => e.category).filter(c => !knownIds.has(c)))];
  const customColors = ["#577590", "#F4A261", "#43AA8B", "#B5838D", "#6D6875"];
  customNames.forEach((name, i) => {
    const hex = customColors[i % customColors.length];
    totals.push({
      id: name,
      icon: "✏️",
      hex,
      value: list.filter(e => e.category === name).reduce((s, e) => s + e.amount, 0)
    });
  });
  return totals;
}

function renderAnalytics() {
  const filtered = getFilteredEntries();
  const content = document.getElementById("analytics-content");
  const total = filtered.reduce((s, e) => s + e.amount, 0);

  if (filtered.length === 0) {
    content.innerHTML = `<div class="empty-msg">No expenses in this range. Add entries or adjust the date filter.</div>`;
    return;
  }

  const totals = buildTotals(filtered);
  const maxVal = Math.max(...totals.map(t => t.value), 1);

  let html = `<div class="summary-card">
    <p class="label">Total in range</p>
    <p class="value">${fmt(total)}</p>
  </div>`;

  html += `<div class="entries-card"><p class="label">By category</p>`;
  totals.forEach(t => {
    const pct = total ? Math.round((t.value / total) * 100) : 0;
    const barPct = Math.round((t.value / maxVal) * 100);
    html += `
      <div class="bar-chart-row">
        <div class="bar-label">${t.icon} ${t.id}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${barPct}%;background:${t.hex}"></div></div>
        <div class="bar-value">${fmt(t.value)} (${pct}%)</div>
      </div>
    `;
  });
  html += `</div>`;

  content.innerHTML = html;
}

// View switching
const VIEWS = ["entry", "analytics", "data", "merge"];
function switchView(active) {
  VIEWS.forEach(v => {
    document.getElementById(`view-${v}`).classList.toggle("active", v === active);
    document.getElementById(`nav-${v}`).classList.toggle("active", v === active);
  });
  if (active === "analytics") renderAnalytics();
  if (active === "data") renderAllData();
}
document.getElementById("nav-entry").addEventListener("click", () => switchView("entry"));
document.getElementById("nav-analytics").addEventListener("click", () => switchView("analytics"));
document.getElementById("nav-data").addEventListener("click", () => switchView("data"));
document.getElementById("nav-merge").addEventListener("click", () => switchView("merge"));

function renderAllData() {
  const el = document.getElementById("all-entries-table");
  if (entries.length === 0) {
    el.innerHTML = `<div class="empty-msg">No data stored yet.</div>`;
    return;
  }
  let html = `<div style="overflow-x:auto;"><table style="width:100%;font-size:13px;border-collapse:collapse;">
    <tr style="border-bottom:1px solid var(--border);text-align:left;color:var(--muted);">
      <th style="padding:6px 4px;">Timestamp</th><th style="padding:6px 4px;">Type</th><th style="padding:6px 4px;">Description</th><th style="padding:6px 4px;text-align:right;">Amount</th>
    </tr>`;
  entries.slice().reverse().forEach(e => {
    const desc = (e.description || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    html += `<tr style="border-bottom:1px solid var(--border);">
      <td style="padding:6px 4px;">${new Date(e.date).toLocaleString()}</td>
      <td style="padding:6px 4px;">${e.category}</td>
      <td style="padding:6px 4px;color:var(--muted);">${desc}</td>
      <td style="padding:6px 4px;text-align:right;font-weight:600;">${fmt(e.amount)}</td>
    </tr>`;
  });
  html += `</table></div>
  <p style="margin-top:10px;font-size:13px;color:var(--muted);">Total rows: ${entries.length} · Grand total: ${fmt(entries.reduce((s,e)=>s+e.amount,0))}</p>`;
  el.innerHTML = html;
}

document.getElementById("date-from").addEventListener("change", renderAnalytics);
document.getElementById("date-to").addEventListener("change", renderAnalytics);
document.getElementById("clear-filter").addEventListener("click", () => {
  document.getElementById("date-from").value = "";
  document.getElementById("date-to").value = "";
  renderAnalytics();
});

renderEntry();
renderAnalytics();
updateLastExportDisplay();

// ---- CSV Export ----
function csvEscape(val) {
  const s = String(val ?? "");
  if (s.includes(",") || s.includes('"') || s.includes("\n")) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function entriesToCSV(list) {
  let csv = "Timestamp,Type,Amount,Description\n";
  list.forEach(e => {
    csv += `${csvEscape(e.date)},${csvEscape(e.category)},${csvEscape(e.amount)},${csvEscape(e.description || "")}\n`;
  });
  return csv;
}

function downloadCSV(filename, content) {
  try {
    const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.style.display = "none";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);

    // Fallback: also open in a new tab in case the download attribute is ignored
    setTimeout(() => {
      const blob2 = new Blob([content], { type: "text/plain;charset=utf-8;" });
      const url2 = URL.createObjectURL(blob2);
      window.open(url2, "_blank");
    }, 300);
  } catch (err) {
    alert("Download failed: " + err.message + "\n\nCSV content:\n\n" + content);
  }
}

document.getElementById("export-btn").addEventListener("click", () => {
  if (entries.length === 0) {
    showToast("No entries to export yet.");
    return;
  }
  const now = new Date();
  const seq = getNextSeq();
  const filename = `exp${seq}-${formatTsForFilename(now)}.csv`;
  downloadCSV(filename, entriesToCSV(entries));
  localStorage.setItem(LAST_EXPORT_KEY, now.toISOString());
  showToast(`Exported ${filename} — check Downloads folder.`);

  // Clear current entries after export (they're backed up now)
  entries = [];
  saveEntries(entries);
  renderEntry();
  renderAnalytics();
  renderAllData();
  updateLastExportDisplay();
});

// ---- Merge multiple exported CSV files ----
function parseCSVLine(line) {
  const result = [];
  let cur = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = false;
      } else {
        cur += ch;
      }
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { result.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  result.push(cur);
  return result;
}

function parseCSV(text) {
  const lines = text.split("\n").map(l => l.replace(/\r$/, "")).filter(l => l.trim());
  const rows = [];
  for (let i = 1; i < lines.length; i++) { // skip header
    const parts = parseCSVLine(lines[i]);
    if (parts.length < 3) continue;
    const [ts, type, amountStr, descStr] = parts;
    const amount = parseFloat(amountStr);
    if (!ts || !type || isNaN(amount)) continue;
    rows.push({ date: ts.trim(), category: type.trim(), amount, description: (descStr || "").trim() });
  }
  return rows;
}

document.getElementById("merge-files").addEventListener("change", (e) => {
  const files = Array.from(e.target.files);
  if (files.length === 0) return;

  const readers = files.map(file => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (evt) => resolve(parseCSV(evt.target.result));
    reader.readAsText(file);
  }));

  Promise.all(readers).then(allRowsArrays => {
    let merged = [];
    const seen = new Set();
    allRowsArrays.flat().forEach(row => {
      const key = row.date + "|" + row.category + "|" + row.amount + "|" + (row.description || "");
      if (seen.has(key)) return;
      seen.add(key);
      merged.push(row);
    });
    merged.sort((a, b) => new Date(a.date) - new Date(b.date));
    renderMergeResults(merged);
  });
});

function renderMergeResults(merged) {
  const summaryEl = document.getElementById("merge-summary");
  const contentEl = document.getElementById("merge-content");

  if (merged.length === 0) {
    summaryEl.innerHTML = `<div class="empty-msg">No valid rows found in selected files.</div>`;
    contentEl.innerHTML = "";
    return;
  }

  const startTs = new Date(merged[0].date);
  const endTs = new Date(merged[merged.length - 1].date);
  const total = merged.reduce((s, r) => s + r.amount, 0);

  summaryEl.innerHTML = `
    <div class="summary-card">
      <p class="label">Combined range</p>
      <p style="font-size:14px;margin:4px 0;">From <strong>${startTs.toLocaleString()}</strong></p>
      <p style="font-size:14px;margin:4px 0;">To <strong>${endTs.toLocaleString()}</strong></p>
      <p class="value">${fmt(total)}</p>
      <p style="font-size:13px;color:var(--muted);margin-top:4px;">${merged.length} rows from ${document.getElementById("merge-files").files.length} file(s)</p>
    </div>
    <button id="merge-export-btn" style="width:100%;margin-top:10px;padding:12px;border:none;border-radius:12px;background:var(--text);color:white;font-size:14px;font-weight:600;cursor:pointer;">
      ⬇ Export combined CSV
    </button>
  `;

  // Category breakdown
  const totals = buildTotals(merged);
  const maxVal = Math.max(...totals.map(t => t.value), 1);

  let html = `<div class="entries-card"><p class="label">By category</p>`;
  totals.forEach(t => {
    const pct = total ? Math.round((t.value / total) * 100) : 0;
    const barPct = Math.round((t.value / maxVal) * 100);
    html += `
      <div class="bar-chart-row">
        <div class="bar-label">${t.icon} ${t.id}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${barPct}%;background:${t.hex}"></div></div>
        <div class="bar-value">${fmt(t.value)} (${pct}%)</div>
      </div>
    `;
  });
  html += `</div>`;
  contentEl.innerHTML = html;

  document.getElementById("merge-export-btn").addEventListener("click", () => {
    const csvEntries = merged.map(r => ({ date: r.date, category: r.category, amount: r.amount, description: r.description }));
    const fname = `total-exp-${formatTsForFilename(startTs)}-${formatTsForFilename(endTs)}.csv`;
    downloadCSV(fname, entriesToCSV(csvEntries));
  });
}

// ---- Sequential export numbering ----
const SEQ_KEY = "expense_export_seq";
const LAST_EXPORT_KEY = "expense_last_export_ts";

function getNextSeq() {
  let seq = parseInt(localStorage.getItem(SEQ_KEY) || "0", 10);
  seq += 1;
  localStorage.setItem(SEQ_KEY, String(seq));
  return seq;
}

function pad(n) { return String(n).padStart(2, "0"); }

function formatTsForFilename(d) {
  // DDMMYYYY-HHMM
  return `${pad(d.getDate())}${pad(d.getMonth()+1)}${d.getFullYear()}-${pad(d.getHours())}${pad(d.getMinutes())}`;
}

function updateLastExportDisplay() {
  const ts = localStorage.getItem(LAST_EXPORT_KEY);
  const el = document.getElementById("last-export-info");
  if (el) {
    el.textContent = ts ? `Last exported: ${new Date(ts).toLocaleString()}` : "Not exported yet";
  }
}
